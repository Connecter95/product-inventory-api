services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: product_inventory_app
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            - db
        networks:
            - product_inventory

    nginx:
        image: nginx:alpine
        container_name: product_inventory_nginx
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - product_inventory

    db:
        image: mysql:8.0
        container_name: product_inventory_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: product_inventory
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: root
            MYSQL_USER: laravel
        ports:
            - "3307:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - product_inventory

networks:
    product_inventory:

volumes:
    dbdata:
